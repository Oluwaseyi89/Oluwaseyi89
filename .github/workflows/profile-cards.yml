name: Update profile cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download cards
        run: |
          fetch() {
            for attempt in 1 2 3 4 5; do
              if curl -sfL --max-time 60 -o "$2.tmp" "$1" \
                && grep -q '<svg' "$2.tmp" \
                && ! grep -q 'Something went wrong' "$2.tmp"; then
                mv "$2.tmp" "$2"
                return 0
              fi
              sleep 15
            done
            echo "::warning::Could not refresh $2, keeping the previous version"
            rm -f "$2.tmp"
          }
          fetch "https://github-readme-stats.vercel.app/api?username=Oluwaseyi89&show_icons=true&hide=stars,issues&show=prs_merged,reviews&theme=tokyonight&hide_border=true&border_radius=8" profile/stats.svg
          fetch "https://streak-stats.demolab.com/?user=Oluwaseyi89&theme=tokyonight&hide_border=true&border_radius=8" profile/streak.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push
